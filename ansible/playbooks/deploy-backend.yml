---
- name: Deploy Backend (API + Worker) to ECS Fargate
  hosts: local
  gather_facts: false

  tasks:
    # -------------------------------------------------------
    # Validaciones previas
    # -------------------------------------------------------
    - name: Validar comandos requeridos
      ansible.builtin.command: "which {{ item }}"
      loop:
        - aws
        - docker
        - git
        - jq
      changed_when: false
      register: cmd_check

    - name: Validar que Docker esté activo
      ansible.builtin.command: docker info
      changed_when: false

    # -------------------------------------------------------
    # Obtener contexto (Account ID + commit)
    # -------------------------------------------------------
    - name: Obtener AWS Account ID
      ansible.builtin.command: aws sts get-caller-identity --query Account --output text
      environment: "{{ aws_environment }}"
      changed_when: false
      register: aws_account_raw

    - name: Registrar AWS Account ID
      ansible.builtin.set_fact:
        aws_account_id: "{{ aws_account_raw.stdout | trim }}"

    - name: Obtener commit actual del repositorio
      ansible.builtin.command: git rev-parse --short HEAD
      args:
        chdir: "{{ repo_root }}"
      changed_when: false
      register: git_commit_raw

    - name: Registrar image tag
      ansible.builtin.set_fact:
        image_tag: "{{ git_commit_raw.stdout | trim }}"

    - name: Componer URIs de ECR
      ansible.builtin.set_fact:
        ecr_api_uri: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ ecr_repo_api }}"
        ecr_worker_uri: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ ecr_repo_worker }}"

    # -------------------------------------------------------
    # Build y push de imagen Docker
    # -------------------------------------------------------
    - name: Autenticar Docker con ECR
      ansible.builtin.shell: >
        aws ecr get-login-password --region {{ aws_region }}
        | docker login --username AWS --password-stdin
        {{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com
      environment: "{{ aws_environment }}"
      changed_when: false
      no_log: true

    - name: Construir imagen Docker del backend
      ansible.builtin.command: >
        docker build -t {{ ecr_repo_api }}:{{ image_tag }} .
      args:
        chdir: "{{ backend_dir }}"
      register: docker_build

    - name: Etiquetar imagen para API en ECR
      ansible.builtin.command: >
        docker tag {{ ecr_repo_api }}:{{ image_tag }}
        {{ ecr_api_uri }}:{{ image_tag }}

    - name: Etiquetar imagen para Worker en ECR
      ansible.builtin.command: >
        docker tag {{ ecr_repo_api }}:{{ image_tag }}
        {{ ecr_worker_uri }}:{{ image_tag }}

    - name: Publicar imagen API en ECR
      ansible.builtin.command: >
        docker push {{ ecr_api_uri }}:{{ image_tag }}

    - name: Publicar imagen Worker en ECR
      ansible.builtin.command: >
        docker push {{ ecr_worker_uri }}:{{ image_tag }}

    # -------------------------------------------------------
    # Actualizar ECS API Service
    # -------------------------------------------------------
    - name: Obtener task definition actual del API Service
      ansible.builtin.shell: >
        aws ecs describe-services
        --cluster {{ ecs_cluster_name }}
        --services {{ ecs_api_service_name }}
        --query 'services[0].taskDefinition'
        --output text
      environment: "{{ aws_environment }}"
      changed_when: false
      register: api_current_td_arn

    - name: Obtener JSON de la task definition API
      ansible.builtin.shell: >
        aws ecs describe-task-definition
        --task-definition {{ api_current_td_arn.stdout | trim }}
        --query 'taskDefinition'
        | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)'
      environment: "{{ aws_environment }}"
      changed_when: false
      register: api_td_json

    - name: Crear nueva revisión de task definition para API
      ansible.builtin.shell: >
        echo '{{ api_td_json.stdout }}'
        | jq '(.containerDefinitions[] | select(.name == "{{ ecs_api_container_name }}") | .image) = "{{ ecr_api_uri }}:{{ image_tag }}"'
        | aws ecs register-task-definition --cli-input-json file:///dev/stdin
        --query 'taskDefinition.taskDefinitionArn'
        --output text
      environment: "{{ aws_environment }}"
      register: api_new_td_arn

    - name: Actualizar ECS API Service con nueva task definition
      ansible.builtin.command: >
        aws ecs update-service
        --cluster {{ ecs_cluster_name }}
        --service {{ ecs_api_service_name }}
        --task-definition {{ api_new_td_arn.stdout | trim }}
        --force-new-deployment
      environment: "{{ aws_environment }}"
      register: api_update_result

    # -------------------------------------------------------
    # Actualizar ECS Worker Service
    # -------------------------------------------------------
    - name: Obtener task definition actual del Worker Service
      ansible.builtin.shell: >
        aws ecs describe-services
        --cluster {{ ecs_cluster_name }}
        --services {{ ecs_worker_service_name }}
        --query 'services[0].taskDefinition'
        --output text
      environment: "{{ aws_environment }}"
      changed_when: false
      register: worker_current_td_arn

    - name: Obtener JSON de la task definition Worker
      ansible.builtin.shell: >
        aws ecs describe-task-definition
        --task-definition {{ worker_current_td_arn.stdout | trim }}
        --query 'taskDefinition'
        | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)'
      environment: "{{ aws_environment }}"
      changed_when: false
      register: worker_td_json

    - name: Crear nueva revisión de task definition para Worker
      ansible.builtin.shell: >
        echo '{{ worker_td_json.stdout }}'
        | jq '(.containerDefinitions[] | select(.name == "{{ ecs_worker_container_name }}") | .image) = "{{ ecr_worker_uri }}:{{ image_tag }}"'
        | aws ecs register-task-definition --cli-input-json file:///dev/stdin
        --query 'taskDefinition.taskDefinitionArn'
        --output text
      environment: "{{ aws_environment }}"
      register: worker_new_td_arn

    - name: Actualizar ECS Worker Service con nueva task definition
      ansible.builtin.command: >
        aws ecs update-service
        --cluster {{ ecs_cluster_name }}
        --service {{ ecs_worker_service_name }}
        --task-definition {{ worker_new_td_arn.stdout | trim }}
        --force-new-deployment
      environment: "{{ aws_environment }}"
      register: worker_update_result

    # -------------------------------------------------------
    # Esperar estabilidad
    # -------------------------------------------------------
    - name: Esperar estabilidad del API Service
      ansible.builtin.command: >
        aws ecs wait services-stable
        --cluster {{ ecs_cluster_name }}
        --services {{ ecs_api_service_name }}
      environment: "{{ aws_environment }}"
      changed_when: false

    - name: Esperar estabilidad del Worker Service
      ansible.builtin.command: >
        aws ecs wait services-stable
        --cluster {{ ecs_cluster_name }}
        --services {{ ecs_worker_service_name }}
      environment: "{{ aws_environment }}"
      changed_when: false

    # -------------------------------------------------------
    # Resumen
    # -------------------------------------------------------
    - name: Mostrar resumen del despliegue backend
      ansible.builtin.debug:
        msg: |
          ================================================
          DESPLIEGUE BACKEND COMPLETADO
          ================================================
          Cluster:        {{ ecs_cluster_name }}
          API Service:    {{ ecs_api_service_name }}
          Worker Service: {{ ecs_worker_service_name }}
          Imagen API:     {{ ecr_api_uri }}:{{ image_tag }}
          Imagen Worker:  {{ ecr_worker_uri }}:{{ image_tag }}
          Task Def API:   {{ api_new_td_arn.stdout | trim }}
          Task Def Worker:{{ worker_new_td_arn.stdout | trim }}
          ================================================
