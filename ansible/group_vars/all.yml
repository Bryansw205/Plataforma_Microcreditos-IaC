---
# === Perfil y región AWS ===
aws_profile: "{{ lookup('env', 'AWS_PROFILE') | default('default', true) }}"
aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"

# === Proyecto ===
project_name: "{{ lookup('env', 'PROJECT_NAME') | default('microcreditos', true) }}"
environment: "{{ lookup('env', 'ENVIRONMENT') | default('dev', true) }}"
name_prefix: "{{ project_name }}-{{ environment }}"

# === Rutas del repositorio ===
repo_root: "{{ lookup('env', 'REPO_ROOT') | default(playbook_dir + '/../..', true) }}"
backend_dir: "{{ repo_root }}/app/backend"
frontend_dir: "{{ repo_root }}/app/frontend"

# === ECR ===
ecr_repo_api: "{{ lookup('env', 'ECR_REPO_API') | default(name_prefix + '-api', true) }}"
ecr_repo_worker: "{{ lookup('env', 'ECR_REPO_WORKER') | default(name_prefix + '-worker', true) }}"

# === ECS ===
ecs_cluster_name: "{{ lookup('env', 'ECS_CLUSTER_NAME') | default(name_prefix + '-cluster', true) }}"
ecs_api_service_name: "{{ lookup('env', 'ECS_API_SERVICE_NAME') | default(name_prefix + '-api-service', true) }}"
ecs_worker_service_name: "{{ lookup('env', 'ECS_WORKER_SERVICE_NAME') | default(name_prefix + '-worker-service', true) }}"
ecs_api_container_name: "{{ lookup('env', 'ECS_API_CONTAINER_NAME') | default('api', true) }}"
ecs_worker_container_name: "{{ lookup('env', 'ECS_WORKER_CONTAINER_NAME') | default('worker', true) }}"

# === Frontend (S3 + CloudFront) ===
frontend_bucket: "{{ lookup('env', 'FRONTEND_BUCKET') | default(name_prefix + '-frontend-' + aws_account_id | default('ACCOUNT_ID', true), true) }}"
frontend_distribution_id: "{{ lookup('env', 'FRONTEND_DISTRIBUTION_ID') | default('', true) }}"

# === Variables de entorno AWS para los playbooks ===
aws_environment:
  AWS_PROFILE: "{{ aws_profile }}"
  AWS_DEFAULT_REGION: "{{ aws_region }}"
