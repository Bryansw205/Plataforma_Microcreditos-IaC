name: CD - Despliegue de Aplicacion (ECR a ECS)

on:
  push:
    branches:
      - dev
    paths:
      - "app/backend/**" 

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Construir y Desplegar en ECS
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir, etiquetar y subir la imagen a ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_API: microcreditos-dev-api
          ECR_REPOSITORY_WORKER: microcreditos-dev-worker
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG ./app/backend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_WORKER:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_WORKER:$IMAGE_TAG

      - name: Forzar actualización en Amazon ECS
        env:
          CLUSTER_NAME: microcreditos-dev-cluster
          API_SERVICE_NAME: microcreditos-dev-api-service
          WORKER_SERVICE_NAME: microcreditos-dev-worker-service 
        run: |
          echo "Actualizando el servicio de la API HTTP..."
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $API_SERVICE_NAME \
            --force-new-deployment \
            --region us-east-1

          echo "Actualizando el servicio del Worker (Procesamiento en segundo plano)..."
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $WORKER_SERVICE_NAME \
            --force-new-deployment \
            --region us-east-1