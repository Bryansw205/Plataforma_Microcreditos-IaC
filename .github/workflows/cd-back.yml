name: CD - Backend

on:
  push:
    branches:
      - dev
    paths:
      - "app/backend/**" 

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-deploy:
    name: Construir y Desplegar en ECS
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Validar credenciales de AWS
        shell: bash
        run: |
          if [[ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Usando OIDC para asumir el rol de AWS."
          elif [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" && -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]]; then
            echo "Usando credenciales basadas en secretos."
          else
            echo "No se encontraron credenciales de AWS. Define AWS_ROLE_TO_ASSUME para OIDC o AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Configurar credenciales de AWS con OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Configurar credenciales de AWS con secretos
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir, etiquetar y subir la imagen a ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: microcreditos-api 
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app/backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Forzar actualización en Amazon ECS
        env:
          CLUSTER_NAME: microcreditos-cluster
          API_SERVICE_NAME: microcreditos-api-service
          WORKER_SERVICE_NAME: microcreditos-worker-service 
        run: |
          echo "Actualizando el servicio de la API HTTP..."
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $API_SERVICE_NAME \
            --force-new-deployment \
            --region us-east-1

          echo "Actualizando el servicio del Worker (Procesamiento en segundo plano)..."
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $WORKER_SERVICE_NAME \
            --force-new-deployment \
            --region us-east-1