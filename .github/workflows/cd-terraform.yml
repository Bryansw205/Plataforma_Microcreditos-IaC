name: CD - Terraform

on:
  push:
    branches:
      - dev
    paths:
      - "IaC_/**" 
      - ".github/workflows/cd-terraform.yml"
  
  workflow_dispatch:
    inputs:
      mode:
        description: "Ejecutar Plan / Apply / Destroy"
        required: true
        type: choice
        default: apply
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    
    concurrency:
      group: terraform-deploy
      cancel-in-progress: false

    defaults:
      run:
        shell: bash
        working-directory: ./IaC_

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.9.0" 

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: ${{ github.event_name == 'push' || inputs.mode == 'plan' || inputs.mode == 'apply' }}
        run: |
          set -o pipefail
          terraform plan -var-file="envs/dev.tfvars" -input=false -out=tfplan -no-color | tee terraform-plan.txt

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        run: |
          set -o pipefail
          terraform apply -input=false -auto-approve -no-color tfplan | tee terraform-apply.txt

      - name: Terraform Destroy
        if: ${{ inputs.mode == 'destroy' }}
        run: |
          set -o pipefail
          terraform destroy -var-file="envs/dev.tfvars" -auto-approve -no-color | tee terraform-destroy.txt

      - name: Upload Terraform logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terraform-deployment-logs
          path: |
            IaC_/terraform-plan.txt
            IaC_/terraform-apply.txt
            IaC_/terraform-destroy.txt
          if-no-files-found: ignore