name: CD - Terraform

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/cd-terraform.yml"
      - "IaC_/**"
  
  workflow_dispatch:
    inputs:
      mode:
        description: "Ejecutar Plan / Apply"
        required: true
        type: choice
        default: apply
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    
    concurrency:
      group: terraform-deploy
      cancel-in-progress: false

    defaults:
      run:
        shell: bash
        working-directory: ./IaC_

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.9.0" 

      - name: Validar credenciales de AWS
        shell: bash
        run: |
          if [[ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Usando OIDC para asumir el rol de AWS."
          elif [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" && -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]]; then
            echo "Usando credenciales basadas en secretos."
          else
            echo "No se encontraron credenciales de AWS. Define AWS_ROLE_TO_ASSUME para OIDC o AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Configure AWS credentials with secrets
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: ${{ github.event_name == 'push' || inputs.mode == 'plan' || inputs.mode == 'apply' }}
        run: |
          set -o pipefail
          terraform plan -input=false -out=tfplan -no-color | tee terraform-plan.txt

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        run: |
          set -o pipefail
          terraform apply -input=false -auto-approve -no-color tfplan | tee terraform-apply.txt

      - name: Upload Terraform logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terraform-deployment-logs
          path: |
            IaC_/terraform-plan.txt
            IaC_/terraform-apply.txt
          if-no-files-found: ignore