# checkov:skip=CKV2_GHA_1: Los permisos se gestionan a nivel de organización o son necesarios para la acción de Checkov.
name: CD - Checkov

on:
  workflow_run:
    workflows: ["CD - Terraform"]
    types:
      - completed
    branches:
      - dev

  workflow_dispatch:

jobs:
  checkov-audit:
    name: Checkov reporte
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Ejecutar Checkov vía Docker
        id: checkov
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$(pwd):/repo" \
            --workdir /repo \
            bridgecrew/checkov:3 \
            --directory /repo/IaC_ \
            -o junitxml \
            --output-file-path /repo/

      - name: Guardar reporte de Checkov
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checkov-security-report
          path: results_junitxml.xml
          if-no-files-found: ignore

      - name: Generar Reporte HTML
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('results_junitxml.xml')
              root = tree.getroot()
              tests = 0
              failures = 0
              errors = 0
              skipped = 0
              for ts in root.iter('testsuite'):
                  tests += int(ts.attrib.get('tests', 0))
                  failures += int(ts.attrib.get('failures', 0))
                  errors += int(ts.attrib.get('errors', 0))
                  skipped += int(ts.attrib.get('skipped', 0))
              
              if tests == 0 and root.tag == 'testsuite':
                  tests += int(root.attrib.get('tests', 0))
                  failures += int(root.attrib.get('failures', 0))
                  errors += int(root.attrib.get('errors', 0))
                  skipped += int(root.attrib.get('skipped', 0))

              passed = tests - errors - failures - skipped
              html = f'''
              <div style=\"font-family: Arial, sans-serif; color: #333;\">
                <h2 style=\"color: #2c3e50;\">Reporte de Seguridad - Checkov</h2>
                <p>El análisis de infraestructura como código ha finalizado.</p>
                <table border=\"1\" cellpadding=\"10\" style=\"border-collapse: collapse; text-align: left; width: 300px;\">
                  <tr style=\"background-color: #f8f9fa;\">
                    <th>Estado</th>
                    <th>Cantidad</th>
                  </tr>
                  <tr><td style=\"color: #28a745;\">✅ Pasados</td><td style=\"text-align: center; font-weight: bold;\">{passed}</td></tr>
                  <tr><td style=\"color: #dc3545;\">❌ Fallidos</td><td style=\"text-align: center; font-weight: bold;\">{failures}</td></tr>
                  <tr><td style=\"color: #fd7e14;\">⚠️ Omitidos</td><td style=\"text-align: center; font-weight: bold;\">{skipped}</td></tr>
                </table>
                <br>
                <p>Revisa el archivo XML adjunto para obtener el detalle de las vulnerabilidades y configuraciones fallidas.</p>
              </div>
              '''
              with open('email_body.html', 'w', encoding='utf-8') as f:
                  f.write(html)
          except Exception as e:
              with open('email_body.html', 'w', encoding='utf-8') as f:
                  f.write(f'<p>Error al generar el reporte HTML: {e}</p>')
          "

      - name: Enviar reporte de Checkov por correo
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Resultados de Checkov - ${{ github.repository }}
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
          html_body: file://email_body.html
          attachments: results_junitxml.xml