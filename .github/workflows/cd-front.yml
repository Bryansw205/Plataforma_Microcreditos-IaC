name: CD - Frontend

on:
  push:
    branches:
      - dev
    paths:
      - "app/frontend/**"
      - ".github/workflows/cd-front.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  deploy-frontend:
    name: Desplegar Web a S3 y CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias y compilar
        working-directory: ./app/frontend
        run: |
          npm install
          npm run build

      - name: Validar credenciales de AWS
        shell: bash
        run: |
          if [[ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]]; then
            echo "Usando OIDC para asumir el rol de AWS."
          elif [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" && -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]]; then
            echo "Usando credenciales basadas en secretos."
          else
            echo "No se encontraron credenciales de AWS. Define AWS_ROLE_TO_ASSUME para OIDC o AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Configurar credenciales de AWS con OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Configurar credenciales de AWS con secretos
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Subir archivos al bucket de Amazon S3
        env:
          BUCKET_NAME: microcreditos-frontend-bucked 
        run: |
          aws s3 sync ./app/frontend/dist s3://$BUCKET_NAME --delete

      - name: Invalidar caché de CloudFront
        env:
          
          DISTRIBUTION_ID: E1A2B3C4D5E6F7 
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"