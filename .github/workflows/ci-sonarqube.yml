name: CI - SonarQube

on:
  push:
    branches:
      - dev
    paths:
      - "IaC_/**"
      - "app/**"
      - "sonar-project.properties"
      - ".github/workflows/ci-sonarqube.yml"

  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "IaC_/**"
      - "app/**"
      - "sonar-project.properties"
      - ".github/workflows/ci-sonarqube.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Analizar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias y ejecutar pruebas del Backend
        run: |
          cd app/backend
          npm install --no-audit
          npx prisma generate
          npx jest tests/unit --coverage

      - name: Instalar dependencias y ejecutar pruebas del Frontend
        run: |
          cd app/frontend
          npm install --no-audit
          npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text

      - name: Ejecutar analisis con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        with:
          args: >
            -Dsonar.qualitygate.wait=false
            -Dsonar.qualitygate.timeout=600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}