name: CI - Checkov

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'IaC_/**'
      - '.github/workflows/ci-checkov.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Análisis de seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: IaC_/
          framework: terraform
          soft_fail: true
          output_format: cli